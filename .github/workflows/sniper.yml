name: sniper

# Cada 30 minutos (y a mano desde la pestaña Actions):
#   1. eBay → guarda precios de referencia por carta (/api/sniper)
#   1b. eBay → referencias a medida para las cartas de Vinted sin precio exacto (/api/ebay-targeted)
#   2. Vinted → lee los anuncios nuevos y busca chollos (/api/vinted). Lo normal lo hace vinted-live.yml
#      cada 15 min; aquí solo se ejecuta al lanzarlo a mano.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://scaard5-analytics.vercel.app' }}
    steps:
      - name: eBay → precios de referencia
        run: |
          SECRET="$(printf '%s' "$ALERT_SECRET" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          curl -sS --fail-with-body -m 90 \
            -H "x-alert-secret: $SECRET" \
            "$APP_URL/api/sniper"

      - name: eBay → referencias a medida (jugador + producto de las cartas vistas en Vinted)
        continue-on-error: true
        run: |
          SECRET="$(printf '%s' "$ALERT_SECRET" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          curl -sS --fail-with-body -m 90 \
            -H "x-alert-secret: $SECRET" \
            "$APP_URL/api/ebay-targeted"

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22

      - name: Vinted → chollos (solo a mano; lo programado va en vinted-live.yml)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/vinted-scan.mjs
