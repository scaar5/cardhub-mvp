name: ebay-sold

# Ventas reales de eBay.es (filtro "Artículos vendidos") → precio de referencia del sniper.
# DESACTIVADO el automático: eBay devuelve 403 a GitHub Actions y a Vercel (IPs de centro de datos).
# Solo a mano desde la pestaña Actions. Para reactivarlo: añadir  schedule: - cron: "17 */6 * * *"
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://scaard5-analytics.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: eBay.es vendidos → referencias
        run: node scripts/ebay-sold-scan.mjs
