name: vinted-probe

# Prueba temporal: leer anuncios de Vinted desde un servidor (para afinar el reconocedor).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer búsquedas de Vinted
        run: |
          cat > p.py <<'PY'
          import re, html, time, urllib.request, urllib.parse, json
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          qs = ["adrenalyn 2025 2026","adrenalyn 25 26","adrenalyn mundial 2026","topps chrome ucc 2025","topps chrome 2024 25","topps uefa club competitions 2025","topps summer signings","match attax 2026","topps premier league 2025","topps chrome premier league","topps finest premier league","topps merlin 2025"]
          out = {}
          for q in qs:
              url = "https://www.vinted.es/catalog?order=newest_first&search_text=" + urllib.parse.quote(q)
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9"})
              try:
                  body = urllib.request.urlopen(req, timeout=30).read().decode("utf8", "replace")
              except Exception as e:
                  print("ERR", q, e); continue
              items = re.findall(r'data-testid="product-item-id-(\d+)--overlay-link" title="([^"]*)"', body)
              out[q] = [html.unescape(t) for _, t in items]
              print("Q", q, len(items))
              for _, t in items: print("T|" + q + "|" + html.unescape(t))
              time.sleep(2)
          json.dump(out, open("titles.json", "w"), ensure_ascii=False)
          PY
          python3 p.py
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-titles
          path: titles.json
