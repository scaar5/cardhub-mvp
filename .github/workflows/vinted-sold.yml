name: vinted-sold

# Ventas reales en Vinted: revisa los anuncios reconocidos que siguen abiertos y apunta los vendidos.
# Modo continuo (como vinted-live): cada ejecución se queda 110 min revisando anuncios uno a uno
# (7–9 s entre peticiones → ~400 por hora), en lotes de 100, primero los de ≥10 € que hace más que no se miran.
# El cron lanza una nueva cada hora; nunca hay dos a la vez (la siguiente espera), así que siempre hay una en marcha.
# Si Vinted frena (403/429), espera 30 min antes de seguir.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: vinted-sold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://scaard5-analytics.vercel.app' }}
      LOOP_MINUTES: "110"
      BATCH: "100"
      PAUSE_MS: "7000"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vinted → ventas (continuo)
        run: node scripts/vinted-sold-check.mjs
