name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          for u in "https://130point.com/sales/" "https://back.130point.com/sales/"; do
            code=$(curl -s -m 20 -A "$UA" -o /tmp/p.html -w "%{http_code}" "$u"); echo "GET $u -> $code $(wc -c </tmp/p.html) $(grep -oi '<title>[^<]*' /tmp/p.html | head -1) $(grep -oic 'cloudflare\|just a moment' /tmp/p.html)"
          done
          code=$(curl -s -m 20 -A "$UA" -o /tmp/p.html -w "%{http_code}" -X POST "https://back.130point.com/sales/" -H "Origin: https://130point.com" -H "Referer: https://130point.com/sales/" --data-urlencode "query=topps merlin quenda" --data "type=2&subcat=-1")
          echo "POST back -> $code $(wc -c </tmp/p.html) cf=$(grep -oic 'cloudflare\|just a moment' /tmp/p.html) eur_usd=$(grep -oic 'USD\|\$[0-9]' /tmp/p.html) quenda=$(grep -oic quenda /tmp/p.html)"
          head -c 600 /tmp/p.html | tr '\n' ' '
