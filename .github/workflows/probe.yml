name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36";
          const H={"User-Agent":UA,"Accept-Language":"es-ES,es;q=0.9",Accept:"text/html,application/json"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const home=await fetch("https://www.vinted.es/",{headers:H});
          const cookie=(home.headers.getSetCookie?.()??[]).map(c=>c.split(";")[0]).join("; ");
          console.log("HOME",home.status,"cookies",cookie.split("; ").map(c=>c.split("=")[0]).join(","));
          const s=await (await fetch("https://www.vinted.es/catalog?order=newest_first&search_text=topps%20merlin",{headers:H})).text();
          const ids=[...new Set([...s.matchAll(/product-item-id-(\d+)/g)].map(m=>m[1]))].slice(0,2);
          for (const id of ["10566626602",...ids.slice(0,1)]) {
            await sleep(2000);
            const h=await (await fetch(`https://www.vinted.es/items/${id}`,{headers:{...H,Cookie:cookie}})).text();
            const i=h.indexOf('is_reserved');
            const w=h.slice(Math.max(0,i-2500),i+1500).replace(/\\"/g,'"');
            const keys=[...new Set([...w.matchAll(/"([a-z_]+)":(true|false|null|-?\d+|"[^"]{0,40}")/g)].map(m=>m[1]+"="+m[2]))];
            console.log("KEYS",id,keys.join(" ").slice(0,2500));
            console.log("BTN",id,[...new Set((h.match(/(Comprar|Vendido|Reservado|Hacer una oferta|Este artículo[^<"]{0,60})/g)||[]))].join(" | "));
          }
          JS
          node p.mjs
